name: QuailEgg PR
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: ["main"]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: qegg-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.head_ref != 'release'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version: '1.26', cache: true }
      - name: Install qegg
        run: go install github.com/SuperQuail/QuailEgg/cmd/qegg@latest
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: sudo apt-get update
      - run: sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1
      - run: wails build -tags webkit2_41
      - run: go test ./...
      - run: env GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build ./...
      - run: env GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go test -c -o /tmp/launcher-win.test.exe ./internal/launcher
      - name: Check
        run: qegg check --ci
      - name: Preview
        shell: bash
        run: |
          qegg plan --markdown > plan.md
          if [ -s plan.md ]; then
            gh pr comment ${{ github.event.pull_request.number }} --edit-last --create-if-none -F plan.md
          else
            echo "no pending release; skipping the plan comment"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
