# Generated by qegg. Keep this file in version control.
schema_version = 1

[project]
default_branch = "main"
repo = "github.com/SuperQuail/neobot-desktop"

[git]
tag_prefix = "v"
remote = "origin"

[release]
mode = "pr"
version_scope = "shared"
github_release = true
commit_message = "chore(release): bump versions"

[[release.build]]
name = "windows"
runner = "windows-latest"
timeout_minutes = 30
yaml = '''
- uses: actions/checkout@v4
  with: { fetch-depth: 0 }
- uses: actions/setup-go@v5
  with: { go-version: '1.26', cache: true }
- uses: actions/setup-node@v4
  with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
- run: choco install nsis -y --no-progress
- run: echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH
  shell: pwsh
- run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1
- run: wails build -platform windows/amd64 -nsis
'''
artifacts = ["build/bin/neobot-desktop-amd64-installer.exe"]

[changes]
dir = ".changes"
scope = ["frontend"]

[verify]
commands = [
  "mkdir -p frontend/dist && printf '<!doctype html>' > frontend/dist/index.html",
  "go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1",
  "wails generate module",
  "cd frontend && npm ci",
  "cd frontend && npm run build",
  "go test ./...",
]
hook_commands = ["go test ./..."]
timeout = "15m"
fail_fast = true

[publish]
registries = ["go"]

[packages."go@neobot-desktop"]
name = "neobot-desktop"
path = "."
resolver = "go"
publish = true

[packages."npm@frontend"]
name = "frontend"
path = "frontend"
resolver = "npm"
publish = false
